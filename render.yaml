# Render Blueprint: hosts the browser version (web/) as a free static site.
# The live webcam, pose model and recognition all run in the visitor's
# browser, so no Python server is needed.
services:
  - type: web
    runtime: static
    name: human-activity-recognition-live
    # Build only inside web/, so Render does not try to install the desktop
    # app's Python packages from requirements.txt.
    rootDir: web
    buildCommand: echo "No build step needed"
    staticPublishPath: ./
